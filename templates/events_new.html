{{define "content"}}
<div id="events-content">
  {{template "sidebar" .}}

  <div id="main-content" class="lg:pl-60">
    <div class="mx-auto max-w-2xl px-4 py-8 sm:px-6 lg:px-8">

      <header class="border-b border-warm-200 pb-6 mb-8">
        <a href="/" class="text-xs font-medium text-accent hover:underline">&larr; Dashboard</a>
        <h1 class="mt-3 text-2xl font-bold tracking-tight text-near-black">New Event</h1>
      </header>

      <form hx-post="/events" hx-target="#events-content" hx-swap="outerHTML" class="space-y-6">
        <div>
          <label for="title" class="block text-xs font-semibold uppercase tracking-[0.1em] text-warm-500 mb-1.5">Title *</label>
          <input id="title" name="title" type="text" required maxlength="200" class="w-full border border-warm-200 bg-white px-3 py-2.5 text-sm text-near-black outline-none transition-colors focus:border-accent break-words" placeholder="Event name" />
        </div>
        <div>
          <label for="description" class="block text-xs font-semibold uppercase tracking-[0.1em] text-warm-500 mb-1.5">Description</label>
          <input id="description" name="description" type="text" maxlength="500" class="w-full border border-warm-200 bg-white px-3 py-2.5 text-sm text-near-black outline-none transition-colors focus:border-accent break-words" placeholder="Brief description" />
        </div>
        <div>
          <label for="date" class="block text-xs font-semibold uppercase tracking-[0.1em] text-warm-500 mb-1.5">Date *</label>
          <input id="date" name="date" type="date" required class="w-full border border-warm-200 bg-white px-3 py-2.5 text-sm text-near-black outline-none transition-colors focus:border-accent" />
        </div>
        <div>
          <label for="min_amount_expected" class="block text-xs font-semibold uppercase tracking-[0.1em] text-warm-500 mb-1.5">Funding Goal (₦) *</label>
          <input id="min_amount_expected" name="min_amount_expected" type="number" step="1" min="1" required class="w-full border border-warm-200 bg-white px-3 py-2.5 text-sm text-near-black outline-none transition-colors focus:border-accent" placeholder="2000" />
        </div>
        <div class="flex items-center gap-3 pt-2">
          <button type="submit" hx-disabled-on="click" class="bg-accent px-5 py-2.5 text-sm font-semibold text-white hover:bg-accent/90 disabled:opacity-50 disabled:cursor-not-allowed">Create Event</button>
          <a href="/" class="px-5 py-2.5 text-sm font-medium text-warm-700 hover:text-near-black">Cancel</a>
        </div>
      </form>

    </div>
  </div>
</div>
{{end}}
