{{define "content"}}
<div id="attendance-content">
  {{template "sidebar" .}}

  <div id="main-content" class="lg:pl-60">
    <div class="mx-auto max-w-3xl px-4 py-8 sm:px-6 lg:px-8">

      <header class="border-b border-warm-200 pb-6 mb-8">
        <a href="/" class="text-xs font-medium text-accent hover:underline">&larr; Dashboard</a>
        <h1 class="mt-3 text-2xl font-bold tracking-tight text-near-black">Record Attendance</h1>
      </header>

      <form hx-post="/attendance" hx-target="#attendance-content" hx-swap="outerHTML" class="space-y-6">
        <div>
          <label for="meeting_date" class="block text-xs font-semibold uppercase tracking-[0.1em] text-warm-500 mb-1.5">Meeting Date *</label>
          <input id="meeting_date" name="meeting_date" type="date" required class="w-full border border-warm-200 bg-white px-3 py-2.5 text-sm text-near-black outline-none transition-colors focus:border-accent max-w-xs" />
        </div>

        <div>
          <div class="overflow-x-auto border border-warm-200">
            <table class="min-w-full text-sm">
              <thead>
                <tr class="border-b border-warm-200 bg-warm-50">
                  <th scope="col" class="px-4 py-2.5 text-left text-[10px] font-semibold uppercase tracking-[0.12em] text-warm-500">Member</th>
                  <th scope="col" class="px-4 py-2.5 text-center text-[10px] font-semibold uppercase tracking-[0.12em] text-warm-500">Present</th>
                  <th scope="col" class="px-4 py-2.5 text-center text-[10px] font-semibold uppercase tracking-[0.12em] text-warm-500">Dues</th>
                  <th scope="col" class="px-4 py-2.5 text-center text-[10px] font-semibold uppercase tracking-[0.12em] text-warm-500">Late</th>
                  <th scope="col" class="px-4 py-2.5 text-center text-[10px] font-semibold uppercase tracking-[0.12em] text-warm-500">Absent</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-warm-200">
                {{range .Members}}
                <tr class="hover:bg-warm-50">
                  <td class="px-4 py-3 font-medium text-near-black">{{.Name}}</td>
                  <td class="px-4 py-3 text-center">
                    <input type="checkbox" name="present_{{.ID}}" value="1" class="h-4 w-4 border-warm-300 text-accent focus:ring-accent" />
                  </td>
                  <td class="px-4 py-3 text-center">
                    <input type="checkbox" name="dues_{{.ID}}" value="1" class="h-4 w-4 border-warm-300 text-accent focus:ring-accent" />
                  </td>
                  <td class="px-4 py-3 text-center">
                    <input type="checkbox" name="late_{{.ID}}" value="1" class="h-4 w-4 border-warm-300 text-accent focus:ring-accent" />
                  </td>
                  <td class="px-4 py-3 text-center">
                    <input type="checkbox" name="absenteeism_{{.ID}}" value="1" class="h-4 w-4 border-warm-300 text-danger focus:ring-danger" />
                  </td>
                </tr>
                {{end}}
              </tbody>
            </table>
          </div>
        </div>

        <div>
          <label for="note" class="block text-xs font-semibold uppercase tracking-[0.1em] text-warm-500 mb-1.5">Note</label>
          <textarea id="note" name="note" rows="3" class="w-full border border-warm-200 bg-white px-3 py-2.5 text-sm text-near-black outline-none transition-colors focus:border-accent" placeholder="Optional note about this meeting"></textarea>
        </div>

        <div class="flex items-center gap-3 pt-2">
          <button type="submit" class="bg-accent px-5 py-2.5 text-sm font-semibold text-white hover:bg-accent/90">Save Attendance</button>
          <a href="/" class="px-5 py-2.5 text-sm font-medium text-warm-700 hover:text-near-black">Cancel</a>
        </div>
      </form>

    </div>
  </div>
</div>
{{end}}
