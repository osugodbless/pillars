{{define "content"}}
<div id="fines-content">
  {{template "sidebar" .}}

  <div id="main-content" class="lg:pl-60">
    <div class="mx-auto max-w-2xl px-4 py-8 sm:px-6 lg:px-8">

      <header class="border-b border-warm-200 pb-6 mb-8">
        <a href="/" class="text-xs font-medium text-accent hover:underline">&larr; Dashboard</a>
        <h1 class="mt-3 text-2xl font-bold tracking-tight text-near-black">Issue Fine</h1>
      </header>

      <form hx-post="/fines" hx-target="#fines-content" hx-swap="outerHTML" class="space-y-6">
        <div>
          <label for="member_id" class="block text-xs font-semibold uppercase tracking-[0.1em] text-warm-500 mb-1.5">Member *</label>
          <select id="member_id" name="member_id" required class="w-full border border-warm-200 bg-white px-3 py-2.5 text-sm text-near-black outline-none transition-colors focus:border-accent">
            <option value="">Select member</option>
            {{range $.Members}}
            <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
          </select>
        </div>
        <div>
          <label for="amount" class="block text-xs font-semibold uppercase tracking-[0.1em] text-warm-500 mb-1.5">Amount (₦) *</label>
          <input id="amount" name="amount" type="number" step="0.01" required class="w-full border border-warm-200 bg-white px-3 py-2.5 text-sm text-near-black outline-none transition-colors focus:border-accent" placeholder="0.00" />
        </div>
        <div>
          <label for="reason" class="block text-xs font-semibold uppercase tracking-[0.1em] text-warm-500 mb-1.5">Reason *</label>
          <input id="reason" name="reason" type="text" required class="w-full border border-warm-200 bg-white px-3 py-2.5 text-sm text-near-black outline-none transition-colors focus:border-accent" placeholder="e.g. Insubordination, disrespect" />
        </div>
        <div>
          <label for="fine_date" class="block text-xs font-semibold uppercase tracking-[0.1em] text-warm-500 mb-1.5">Date</label>
          <input id="fine_date" name="fine_date" type="date" class="w-full border border-warm-200 bg-white px-3 py-2.5 text-sm text-near-black outline-none transition-colors focus:border-accent" />
        </div>
        <div class="flex items-center gap-3 pt-2">
          <button type="submit" class="bg-accent px-5 py-2.5 text-sm font-semibold text-white hover:bg-accent/90">Issue Fine</button>
          <a href="/" class="px-5 py-2.5 text-sm font-medium text-warm-700 hover:text-near-black">Cancel</a>
        </div>
      </form>

    </div>
  </div>
</div>
{{end}}
